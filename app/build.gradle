plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifiradar.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wifiradar.app"
        // Microwear Ultra AI 3 roda Android 8.1 (API 27) ou 9.0 (API 28).
        // minSdk 26 (Android 8.0) cobre ambos com folga.
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            // Para gerar APK assinado de release, configure signingConfig
            // ou use `./gradlew assembleDebug` para um APK de debug pronto p/ instalar.
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
